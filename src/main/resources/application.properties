# H2: an in-memory database — perfect for class; data disappears on restart
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# print every SQL statement Hibernate generates — watch the console!
spring.jpa.show-sql=true

# create tables from the @Entity classes at startup, drop them at shutdown
spring.jpa.hibernate.ddl-auto=create-drop

# run data.sql AFTER Hibernate creates the tables (required since Boot 2.5)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# browse the database at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:testdb)
spring.h2.console.enabled=true
